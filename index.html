<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keqtt Art - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #2b5876, #4e4376);
            color: white;
            text-align: center;
            padding: 4rem 1rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            color: #2b5876;
            border-bottom: 2px solid #eee;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        ul {
            list-style-type: square;
            padding-left: 1.2rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #e9ecef;
            color: #6c757d;
            font-size: 0.9rem;
        }

        a {
            color: #2b5876;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>欢迎来到 Keqtt Art 的主页</h1>
        <p>记录想法，分享设计与创作</p>
    </header>

    <main>
        <section class="card">
            <h2>关于我</h2>
            <p>你好！我是 keqtt-art。这里是我的个人 GitHub Pages 主页，用于展示项目、记录学习心得与创意点子。</p>
        </section>

        <section class="card">
            <h2>更新与项目</h2>
            <ul>
                <li><strong>个人网站建设：</strong>基于 GitHub Pages 搭建个人主页（进行中）</li>
                <li><strong>想法记录：</strong>后续将同步更新笔记与项目文档</li>
            </ul>
        </section>

        <section class="card">
            <h2>联系与链接</h2>
            <p>GitHub 主页：<a href="https://github.com/keqtt-art" target="_blank">@keqtt-art</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Keqtt Art. Powered by GitHub Pages.</p>
    </footer>

</body>
</html>
